<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>67 Cabs - Admin Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-amber-400 flex items-center gap-2">
          <span>🛡️</span> 67 Cabs Admin Portal
        </h1>
        <p class="text-xs text-slate-400">Driver Partner KYC Verification & Approvals</p>
      </div>
      <button onclick="loadDrivers()" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition">
        🔄 Refresh List
      </button>
    </div>

    <!-- Drivers Table -->
    <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-200">Registered Driver Partners</h2>
        <span id="total-drivers-count" class="text-xs bg-slate-800 px-3 py-1 rounded-full font-bold text-amber-400">0 Drivers</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-950 text-slate-400 uppercase font-bold border-b border-slate-800">
            <tr>
              <th class="p-3.5">Photo & Info</th>
              <th class="p-3.5">Mobile</th>
              <th class="p-3.5">Vehicle Details</th>
              <th class="p-3.5">UPI ID</th>
              <th class="p-3.5">KYC Documents</th>
              <th class="p-3.5">Status</th>
              <th class="p-3.5 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="drivers-table-body" class="divide-y divide-slate-800">
            <tr>
              <td colspan="7" class="p-6 text-center text-slate-500">Loading drivers...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Document Inspection Modal -->
  <div id="doc-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-3xl rounded-2xl p-6 shadow-2xl space-y-4 my-8">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div>
          <h3 class="text-base font-bold text-amber-400" id="modal-driver-title">Driver Documents</h3>
          <p class="text-xs text-slate-400" id="modal-driver-subtitle">-</p>
        </div>
        <button onclick="closeDocModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[65vh] overflow-y-auto p-1" id="modal-doc-grid"></div>

      <div class="border-t border-slate-800 pt-3 flex justify-end gap-3" id="modal-action-buttons"></div>
    </div>
  </div>

  <script>
    let loadedDriversList = [];

    async function loadDrivers() {
      try {
        const res = await fetch('/api/admin/drivers');
        const data = await res.json();
        if (data.success) {
          loadedDriversList = data.drivers;
          renderTable(data.drivers);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderTable(drivers) {
      document.getElementById('total-drivers-count').innerText = `${drivers.length} Drivers`;
      const tbody = document.getElementById('drivers-table-body');
      
      if (drivers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">No driver registrations found.</td></tr>`;
        return;
      }

      let html = '';
      drivers.forEach(d => {
        let badge = '';
        if (d.status === 'APPROVED') {
          badge = `<span class="bg-green-950 border border-green-800 text-green-400 px-2.5 py-1 rounded-full font-bold">APPROVED</span>`;
        } else if (d.status === 'BLOCKED') {
          badge = `<span class="bg-red-950 border border-red-800 text-red-400 px-2.5 py-1 rounded-full font-bold">BLOCKED</span>`;
        } else {
          badge = `<span class="bg-amber-950 border border-amber-800 text-amber-400 px-2.5 py-1 rounded-full font-bold animate-pulse">PENDING APPROVAL</span>`;
        }

        const avatarImg = d.documents?.selfiePhoto ? `<img src="${d.documents.selfiePhoto}" class="h-9 w-9 rounded-full object-cover border border-amber-400 inline-block mr-2" />` : '<div class="h-9 w-9 rounded-full bg-slate-800 inline-flex items-center justify-center mr-2 text-sm">👨‍✈️</div>';

        html += `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-3.5 flex items-center font-semibold text-white">
              ${avatarImg}
              <div>
                <div>${d.name}</div>
                <div class="text-[10px] text-slate-500">${d.email || 'No email'}</div>
              </div>
            </td>
            <td class="p-3.5 font-mono text-slate-300">${d.phone}</td>
            <td class="p-3.5">
              <span class="font-mono bg-slate-950 px-2 py-1 rounded text-amber-400 font-bold">${d.vehicleNo}</span>
              <span class="text-slate-400 ml-1">(${d.cabType})</span>
            </td>
            <td class="p-3.5 text-slate-300">${d.upiId || '67cabs@upi'}</td>
            <td class="p-3.5">
              <button onclick="viewDocuments('${d.driverId}')" class="bg-indigo-950 border border-indigo-700 hover:bg-indigo-900 text-indigo-300 font-bold px-2.5 py-1 rounded-lg transition">
                👁️ View KYC (8)
              </button>
            </td>
            <td class="p-3.5">${badge}</td>
            <td class="p-3.5 text-center space-x-2">
              ${d.status !== 'APPROVED' ? `
                <button onclick="updateDriverStatus('${d.driverId}', 'APPROVED')" class="bg-green-600 hover:bg-green-500 text-white font-bold px-3 py-1.5 rounded-lg transition shadow">
                  Approve
                </button>
              ` : `
                <button onclick="updateDriverStatus('${d.driverId}', 'BLOCKED')" class="bg-red-600 hover:bg-red-500 text-white font-bold px-3 py-1.5 rounded-lg transition shadow">
                  Block
                </button>
              `}
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function viewDocuments(driverId) {
      const driver = loadedDriversList.find(d => d.driverId === driverId);
      if (!driver) return;

      document.getElementById('modal-driver-title').innerText = `${driver.name} - KYC Documents`;
      document.getElementById('modal-driver-subtitle').innerText = `Phone: ${driver.phone} | Vehicle: ${driver.vehicleNo} (${driver.cabType})`;

      const docs = driver.documents || {};
      const docTypes = [
        { key: 'selfiePhoto', title: '📸 Live Selfie / Profile' },
        { key: 'drivingLicenseFront', title: '🪪 Driving License (Front)' },
        { key: 'drivingLicenseBack', title: '🪪 Driving License (Back)' },
        { key: 'vehicleRc', title: '📄 Vehicle RC' },
        { key: 'aadhaarCardFront', title: '🆔 Aadhaar Card (Front)' },
        { key: 'aadhaarCardBack', title: '🆔 Aadhaar Card (Back)' },
        { key: 'panCard', title: '💳 PAN Card' },
        { key: 'bankPassbook', title: '🏦 Bank Statement / Passbook' }
      ];

      let gridHtml = '';
      docTypes.forEach(t => {
        const imgSrc = docs[t.key];
        if (imgSrc) {
          gridHtml += `
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
              <div class="text-xs font-bold text-amber-400">${t.title}</div>
              <a href="${imgSrc}" target="_blank" title="Click to view full resolution">
                <img src="${imgSrc}" class="w-full h-44 object-contain rounded-lg bg-black/40 border border-slate-800 hover:opacity-90 transition cursor-zoom-in" />
              </a>
            </div>
          `;
        } else {
          gridHtml += `
            <div class="bg-slate-950 p-4 rounded-xl border border-dashed border-slate-800 flex flex-col items-center justify-center text-slate-500 text-xs">
              <div>${t.title}</div>
              <div class="text-[10px] text-red-400 mt-1">Not Uploaded</div>
            </div>
          `;
        }
      });

      document.getElementById('modal-doc-grid').innerHTML = gridHtml;

      document.getElementById('modal-action-buttons').innerHTML = `
        <button onclick="closeDocModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">Close</button>
        ${driver.status !== 'APPROVED' ? `
          <button onclick="updateDriverStatus('${driver.driverId}', 'APPROVED'); closeDocModal();" class="bg-green-600 hover:bg-green-500 text-white font-black px-5 py-2 rounded-xl text-xs">Approve Driver</button>
        ` : `
          <button onclick="updateDriverStatus('${driver.driverId}', 'BLOCKED'); closeDocModal();" class="bg-red-600 hover:bg-red-500 text-white font-black px-5 py-2 rounded-xl text-xs">Block Driver</button>
        `}
      `;

      document.getElementById('doc-modal').classList.remove('hidden');
      document.getElementById('doc-modal').classList.add('flex');
    }

    function closeDocModal() {
      document.getElementById('doc-modal').classList.add('hidden');
      document.getElementById('doc-modal').classList.remove('flex');
    }

    async function updateDriverStatus(driverId, status) {
      try {
        const res = await fetch('/api/admin/driver/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverId, status })
        });
        const data = await res.json();
        if (data.success) {
          loadDrivers();
        } else {
          alert(data.message);
        }
      } catch (e) {
        alert("Action failed.");
      }
    }

    window.addEventListener('load', loadDrivers);
  </script>
</body>
</html>
